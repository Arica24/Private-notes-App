<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Private Notes</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header class="topbar"><a class="brand" href="{{ url_for('index') }}">Private<span>Notes</span></a>{% if g.user %}<div class="account"><span>{{ g.user['username'] }}</span><form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="quiet" type="submit">Sign out</button></form></div>{% endif %}</header>
<main>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="notice {{ category }}" role="status">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><footer>A little space for your thoughts.</footer></body></html>
